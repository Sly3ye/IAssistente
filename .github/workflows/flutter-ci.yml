name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write minimal env
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Runtime config check
        run: ./scripts/check_runtime_config.sh

      - name: Release gate (static)
        run: ./scripts/release_gate.sh --expected-package it.dallacog.mimir --relaxed

      - name: Analyze
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          NO_PROXY: localhost,127.0.0.1,::1
        run: flutter analyze

      - name: Test
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          NO_PROXY: localhost,127.0.0.1,::1
        run: flutter test -r compact

      - name: Android debug build smoke
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          NO_PROXY: localhost,127.0.0.1,::1
        run: flutter build apk --debug
